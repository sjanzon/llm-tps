; llama.cpp router presets (llama-server --models-preset models.ini)
; Example for a single 24 GB GPU (RTX 4090). Adjust model paths, context sizes and sampling.
version = 1

; Settings shared by all models
[*]
flash-attn = on
cache-type-k = q8_0
cache-type-v = q8_0
parallel = 1
jinja = true

; Dense 27B, fully on the GPU, MTP speculative decoding
[qwen3.8-27b]
model = /path/to/models/Qwen3.8-27B-UD-Q4_K_XL.gguf
n-gpu-layers = 99
c = 131072
spec-type = draft-mtp
model-draft = /path/to/models/mtp-Qwen3.8-27B-Q4_0.gguf
n-gpu-layers-draft = 99
temp = 1.0
top-p = 0.95
top-k = 20
min-p = 0.0

; MoE 35B (3B active): full 256k context, --fit moves some experts to system RAM if needed
[qwen3.6-35b-a3b]
model = /path/to/models/Qwen3.6-35B-A3B-MTP-UD-Q4_K_XL.gguf
fit = on
c = 262144
spec-type = draft-mtp
spec-draft-n-max = 2
temp = 1.0
top-p = 0.95
top-k = 20
min-p = 0.0

; MoE 26B (4B active), QAT 4-bit, MTP draft and vision projector (mmproj) for image input
[gemma-4-26b-a4b]
model = /path/to/models/gemma-4-26B-A4B-it-qat-UD-Q4_K_XL.gguf
fit = on
c = 262144
spec-type = draft-mtp
model-draft = /path/to/models/mtp-gemma-4-26B-A4B-it-Q8_0.gguf
mmproj = /path/to/models/mmproj-gemma-4-26B-A4B-it-F16.gguf
n-gpu-layers-draft = 99
spec-draft-n-max = 2
temp = 1.0
top-p = 0.95
top-k = 64
min-p = 0.0
